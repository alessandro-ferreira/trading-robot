[server]
orchestrator_interval = "10s"
refresh_strat_interval = "1m"
default_exchange_timeout = "10s"
shutdown_timeout = "30s"
check_pending_policy = ["0s", "10s"]

[grpc]
go_bot_address = "localhost:50050"
python_gateway_address = "localhost:50051"
management_address = "0.0.0.0:50052"
connection_timeout = "5s"

[database]
host = "localhost"
port = 5432
user = "testuser"
password = "testpassword"
dbname = "testdb"
sslmode = "disable"
max_conns = 20
connect_timeout = "2s"
statement_timeout = "5s"
lock_timeout = "3s"
idle_in_tx_session_timeout = "2m"

[go_log]
level = "info"
format = "json"
path = "/var/log/go-bot.log"
rotate = true
source = false

[health_check]
asset = "BTC"
interval = "3m"
retry_attempts = 2
retry_delay = "1s"

[cron.market_data_cleanup]
enabled = true
schedule = "0 0 6 * * *"
retention_days = 14
run_on_startup = true

[risk]
max_open_positions = 3
max_budget_per_trade = { USDT = 100.0, BRL = 500.0 }

[[exchange]]
name = "binance"
sandbox_mode = true
health_check = true

[[exchange]]
name = "coinbase"
sandbox_mode = false
health_check = false

[simulation]
enabled = false
symbol = "BTC"
begin = "2023-01"
end = "2023-01"
input = "testdata/input_prices.csv"
output = "testdata/output_trades.csv"
initial_usdt = 1000.0
